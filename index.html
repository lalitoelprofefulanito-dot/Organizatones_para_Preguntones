/*
VOICE: maestro cálido y claro; frases cortas para niñas y niños, notas precisas para docentes.
IDEA: la «Libreta del Pensador Visual» convertida en mesa de trabajo: piezas recortables que se acomodan sobre una hoja.
PICTURE: el tablero blanco con piezas de colores, y en el inicio cada organizador se ve armado en miniatura.
COLOUR and TYPE: los cinco colores de familia del kit (naranja, azul, verde, rojo, morado) sobre blanco; Baloo 2 para títulos y Arial grande para leer.
LAYOUT: escritorio = panel de teoría a la izquierda y tablero a la derecha; celular = tablero arriba y panel abajo.
*/
:root{color-scheme:light;--ink:#151515;--mut:#333;--bg:#fff;--soft:#EEF1F4;--O:#D84315;--B:#1565C0;--G:#2E7D32;--R:#C62828;--P:#6A1B9A;--Y:#9A5B00;--K:#37474F;--c:#1565C0}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html{scroll-padding-top:20px}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 Arial,Helvetica,sans-serif;overflow-x:clip}
h1,h2,h3,.bt{font-family:"Baloo 2",Arial,sans-serif;line-height:1.08;margin:0}
a{color:var(--B)}
button{font:inherit;color:inherit;cursor:pointer}
.rb{height:12px;background:linear-gradient(90deg,var(--O) 0 14%,var(--B) 14% 28%,var(--G) 28% 42%,var(--R) 42% 57%,var(--P) 57% 71%,#00838F 71% 85%,var(--Y) 85%)}
.tb{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:6px 14px;border:2.5px solid var(--ink);border-radius:12px;background:#fff;font-weight:bold;font-size:16px;text-decoration:none;color:var(--ink);white-space:nowrap}
.tb:hover{background:#F5F5F5}
.tb:focus-visible,.chip:focus-visible,.card:focus-visible{outline:4px solid #FF8F00;outline-offset:2px}
.tb.on{background:var(--ink);color:#fff}
.tb.pri{background:var(--c);border-color:var(--c);color:#fff}
.tb.red{border-color:var(--R);color:var(--R)}
.tb[disabled]{opacity:.45;cursor:default}
.chip{display:inline-flex;align-items:center;min-height:40px;padding:4px 14px;border-radius:999px;border:2.5px solid var(--c);background:#fff;color:var(--ink);font-weight:bold;font-size:15px}
.chip.on{background:var(--c);color:#fff}
.pill{display:inline-block;padding:2px 12px;border-radius:999px;background:var(--c);color:#fff;font-weight:bold;font-size:14px;letter-spacing:.2px}
.wrapw{max-width:1240px;margin:0 auto;padding:0 max(4vw,16px)}
/* ---------- INICIO ---------- */
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sec{padding:26px 0;border-top:3px solid var(--ink)}
.sec h2{font-size:clamp(28px,3.4vw,40px);margin-bottom:8px}
.sec>p{max-width:75ch;margin:0 0 14px}
.five{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;counter-reset:f;padding:0;margin:0;list-style:none}
.five li{border:3px solid var(--c);border-radius:14px;padding:12px;background:#fff;font-size:16px}
.five li b{display:block;font-family:"Baloo 2",Arial;font-size:21px;color:var(--c)}
.ruta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.qbtn{text-align:left;border:3px solid var(--ink);border-radius:14px;background:#fff;padding:12px 14px;font-weight:bold;font-size:17px;min-height:56px}
.qbtn.on{background:var(--ink);color:#fff}
.res{margin-top:14px;border:3px dashed var(--P);border-radius:14px;padding:14px;display:none}
.res.show{display:block}
.fam{margin-top:22px}
.fam h3{font-size:28px;color:var(--c);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin-top:10px}
.card{display:block;border:3px solid var(--c);border-radius:16px;background:#fff;padding:0;text-align:left;overflow:hidden;transition:transform .15s;text-decoration:none;color:var(--ink)}
.card:hover{transform:translateY(-3px)}
.card .th{background:var(--soft);border-bottom:3px solid var(--c);aspect-ratio:14/9}
.card .th svg{width:100%;height:100%;display:block}
.card .cb{padding:10px 14px 14px}
.card .cn{display:flex;gap:8px;align-items:center;font-family:"Baloo 2",Arial;font-weight:800;font-size:21px;line-height:1.1}
.nb{flex:none;display:inline-grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--c);color:#fff;font-family:"Baloo 2",Arial;font-weight:800;font-size:18px}
.card p{margin:6px 0 0;font-size:15.5px;color:var(--mut)}
details.doc{border:3px solid var(--ink);border-radius:14px;margin:10px 0;background:#fff}
details.doc summary{cursor:pointer;padding:12px 16px;font-family:"Baloo 2",Arial;font-weight:800;font-size:22px;list-style:none}
details.doc summary::before{content:"+ ";color:var(--P)}
details.doc[open] summary::before{content:"– "}
details.doc .in{padding:0 16px 16px}
table.t{border-collapse:collapse;width:100%;font-size:16px}
table.t th{background:var(--ink);color:#fff;text-align:left;padding:8px}
table.t td{border:2px solid var(--ink);padding:8px;vertical-align:top}
.scroll{overflow-x:auto}
footer{padding:26px 0 40px;border-top:3px solid var(--ink);font-size:15px}
/* ---------- CONSTRUCTOR ---------- */
.bld{display:grid;grid-template-rows:auto minmax(0,1fr);grid-template-areas:"h h" "s w";height:100vh;height:100dvh}
.bh{grid-area:h;display:flex;align-items:center;border-bottom:4px solid var(--c);background:#fff;flex-wrap:wrap}
.bh .bt{font-weight:800}
.bh .bt small{display:block;font-family:Arial;font-weight:bold;color:var(--c)}
.only-m{display:none}
.side{grid-area:s;display:flex;flex-direction:column;border-right:4px solid var(--ink);background:#fff;min-height:0}
.pane{overflow:auto;flex:1}
.pane h3{color:var(--c)}
.pane h3:first-child{margin-top:4px}
.pane p{margin:4px 0 8px}
.box{border:3px solid var(--c);border-radius:14px;background:#fff}
.box.ok{border-color:var(--G)}
.box.no{border-color:var(--R)}
.box.tip{border-color:var(--Y)}
.box b.l{display:block;font-size:14px;text-transform:uppercase;letter-spacing:.3px;margin-bottom:2px}
.box.ok b.l{color:var(--G)}
.box.no b.l{color:var(--R)}
.box.tip b.l{color:var(--Y)}
.ex{white-space:pre-wrap;font-family:Arial;font-size:16px;background:var(--soft);border-radius:10px;padding:10px 12px;margin:6px 0;border:2px solid var(--ink)}
.steps{list-style:none;padding:0;margin:6px 0}
.steps li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:2px dotted #888}
.steps input{width:24px;height:24px;flex:none;margin-top:2px;accent-color:var(--c)}
.mini{display:flex;gap:8px;align-items:flex-start}
.mini svg{width:70px;flex:none}
input.big,textarea.big{width:100%;font:18px/1.4 Arial;padding:10px 12px;border:2.5px solid var(--ink);border-radius:10px}
textarea.big{min-height:84px;resize:vertical}
.fb{margin-top:8px;font-weight:bold}
.form{border:3px solid var(--c);border-radius:14px;margin:12px 0;overflow:hidden}
.form .fh{background:var(--c);color:#fff;font-weight:bold;padding:8px 12px;font-size:17px}
.form .fth{background:var(--soft);aspect-ratio:14/9;border-bottom:2px solid var(--c)}
.form .fth svg{width:100%;height:100%;display:block}
.form .fbd{padding:10px 12px}
.form ol{margin:4px 0 10px;padding-left:22px}
.pal{list-style:none;margin:6px 0;padding:0}
.pal li{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:2px dotted #888}
.pal .pv{width:64px;height:44px;flex:none;touch-action:none;cursor:grab;border:2px dashed var(--ink);border-radius:8px;background:var(--soft)}
.pal .pn{flex:1;font-weight:bold;font-size:16px;touch-action:none;cursor:grab;line-height:1.2}
.pal .pc{font-weight:bold;min-width:26px;text-align:center;font-size:18px}
.pm{width:46px;height:46px;border-radius:50%;border:3px solid var(--ink);background:#fff;font-size:26px;font-weight:bold;line-height:1;display:grid;place-items:center;padding:0}
.pm.add{background:var(--c);border-color:var(--c);color:#fff}
.work{grid-area:w;display:flex;flex-direction:column;min-height:0;position:relative;background:var(--soft)}
.tools{display:flex;flex-wrap:wrap;background:#fff;border-bottom:3px solid var(--ink)}
.tools .sp{flex:1}
.tools .tb,.selbar .tb,.selbar .sw{flex:none}
.hint{display:none;background:#1B5E20;color:#fff;font-weight:bold;padding:10px 14px;font-size:17px}
.hint.show{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hint .tb{min-height:38px}
.wrap{flex:1;overflow:auto;min-height:0;-webkit-overflow-scrolling:touch}
#bd{display:block;margin:6px auto;background:#fff;touch-action:none;box-shadow:0 0 0 3px var(--ink),8px 8px 0 rgba(0,0,0,.18);user-select:none;-webkit-user-select:none}
.selbar{position:absolute;display:flex;background:#fff;border:3px solid var(--ink);border-radius:14px;box-shadow:0 6px 0 rgba(0,0,0,.2);z-index:5}
.selbar[hidden]{display:none}
.selbar .lbl{font-weight:bold;align-self:center;padding:0 6px}
.sw{width:40px;height:40px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2.5px var(--ink);padding:0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:60;padding:10px}
.modal.show{display:flex}
.dlg{background:#fff;border-radius:18px;border:4px solid var(--c);width:min(680px,100%);max-height:92vh;max-height:92dvh;overflow:auto;padding:18px}
.dlg h3{font-size:26px;margin-bottom:8px}
.dlg label{display:block;font-weight:bold;margin:10px 0 4px}
.dlg .acts{display:flex;justify-content:flex-end;gap:10px;margin-top:16px;flex-wrap:wrap}
.warn{color:var(--R);font-weight:bold;font-size:15px;min-height:1.2em}
.icg{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.icg button{border:2.5px solid var(--ink);border-radius:10px;background:#fff;padding:4px;aspect-ratio:1}
.icg button.on{background:#FFE082;border-color:var(--Y);box-shadow:0 0 0 3px var(--Y)}
.icg svg{width:100%;height:100%}
canvas.draw{width:100%;aspect-ratio:17/12;border:3px solid var(--ink);border-radius:10px;touch-action:none;background:#fff;display:block}
.toast{position:fixed;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:bold;border-radius:12px;z-index:80;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.ghost{position:fixed;z-index:90;pointer-events:none;width:90px;height:60px;border:3px dashed var(--c);border-radius:10px;background:rgba(255,255,255,.9);transform:translate(-50%,-50%);display:grid;place-items:center;font-weight:bold;font-size:13px;text-align:center}
.rev li{margin:6px 0}
.lv{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.lv .chip{font-size:14px;min-height:36px}
img.out{max-width:100%;border:2px solid var(--ink);border-radius:8px}
/* ---------- COMPACTO: más espacio para trabajar ---------- */
.bld{grid-template-columns:350px minmax(0,1fr)}
.bld.nop{grid-template-columns:0 minmax(0,1fr)}
.bld.nop .side{display:none}
.bh{padding:4px 10px;gap:8px;border-bottom-width:3px}
.bh .tb,.tools .tb{padding:4px 10px;font-size:15px;border-width:2px;border-radius:10px}
.bh .bt small{font-size:12.5px}
.bh .nb{width:32px;height:32px;font-size:15px}
.side{border-right-width:3px}
.tools{gap:5px;padding:5px 8px;border-bottom-width:2px}
.box{border-width:2px;padding:10px 12px;margin:8px 0}
.selbar{flex-wrap:nowrap;overflow-x:auto;padding:5px;gap:5px;border-width:2px;bottom:6px;left:6px;right:6px}
.selbar.wrapc{flex-wrap:wrap}
.selbar .tb{min-height:38px;padding:4px 10px;font-size:15px;border-width:2px}
.mic-on{background:#C62828!important;border-color:#C62828!important;color:#fff!important;animation:pulso 1.4s infinite}
@keyframes pulso{50%{box-shadow:0 0 0 6px rgba(198,40,40,.25)}}
.vzbar{position:fixed;left:8px;bottom:8px;z-index:70;display:flex;align-items:center;gap:10px;background:#fff;border:3px solid #C62828;border-radius:16px;padding:6px 10px;box-shadow:0 6px 0 rgba(0,0,0,.18)}
@media (max-width:560px){
 .vzbar{flex-wrap:wrap}
}
.vzbar[hidden]{display:none}
.vzbar small{font-size:13px;color:var(--mut)}
.vzt{flex:1;min-width:80px;font-style:italic;color:#1565C0;font-size:16px;max-height:3em;overflow:hidden}
.vzdot{flex:none;width:16px;height:16px;border-radius:50%;background:#C62828;animation:pulso 1.4s infinite}
.vzdot.dic{background:#2E7D32}
/* ---------- PORTADA, GRADOS Y FAMILIAS ---------- */
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:8px max(2vw,12px);border-bottom:3px solid var(--ink);background:#fff;position:sticky;top:0;z-index:20}
.brand{font-family:"Baloo 2",Arial;font-weight:800;font-size:26px;text-decoration:none;white-space:nowrap}
.brand span:nth-child(1){color:var(--O)}
.brand span:nth-child(2){color:var(--B)}
.brand span:nth-child(3){color:var(--G)}
header.top nav .tb{flex:none}
.feat{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:6px}
.feat li{display:flex;gap:10px;align-items:center;font-size:18px}
.feat li span{font-size:24px;width:34px;text-align:center}
.ghead{display:flex;gap:18px;align-items:center;margin:20px 0 6px;padding:18px 20px;border-radius:20px;background:var(--g);color:#fff}
.ghead .tn{font-family:"Baloo 2",Arial;font-weight:800;font-size:64px;line-height:1;flex:none}
.ghead h1{font-size:clamp(28px,4vw,44px)}
.ghead p{margin:4px 0 0;font-size:17px}
.tips{padding-left:22px;font-size:17px;line-height:1.5}
.tips li{margin:6px 0}
.lect{font-size:19px;line-height:1.6;background:#FFFDE7;border:2px solid #F9A825;border-radius:12px;padding:6px 16px}
.lect p{margin:8px 0}
@media (max-width:560px){
 .ghead{flex-direction:column;align-items:flex-start}
 .ghead .tn{font-size:48px}
 header.top nav{overflow-x:auto;flex-wrap:nowrap;width:100%}
}
/* ---------- BOTONES CON BRILLO, PORTADA ESCOLAR, DENSIDAD ---------- */
.gl{position:relative;overflow:hidden;background-color:var(--g)!important;background-image:linear-gradient(180deg,rgba(255,255,255,.24) 0%,rgba(255,255,255,0) 48%,rgba(0,0,0,.14) 100%)!important;border:1px solid rgba(0,0,0,.28)!important;color:#fff!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -2px 0 rgba(0,0,0,.14),0 3px 8px rgba(0,0,0,.18)!important}
.gl::before{content:"";position:absolute;left:4%;right:4%;top:1px;height:46%;border-radius:12px 12px 50% 50%/12px 12px 14px 14px;background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,0));pointer-events:none}
.mt.big.gl::before,.ghead.gl::before{height:38%;background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,0))}
.gl>*{position:relative}
a.gl:hover,button.gl:hover{filter:brightness(1.06) saturate(1.05)}
a.gl:active,button.gl:active{transform:translateY(1px);box-shadow:inset 0 2px 4px rgba(0,0,0,.25)!important}
.mosaic{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch;justify-content:flex-end}
.mt{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:64px;min-height:56px;padding:5px 8px;border-radius:12px;text-decoration:none;font:bold 13px/1.1 Arial,sans-serif;text-align:center;cursor:pointer}
.mt .gn{font-family:"Baloo 2",Arial;font-weight:800;font-size:22px;line-height:1}
.mt.big{min-height:112px;min-width:0;padding:10px 8px;font-size:15px;border-radius:16px;gap:4px}
.mt.big .gn{font-size:40px}
.mt.big small{font-weight:normal;font-size:12.5px;opacity:.95}
.mt.on{outline:3px solid #FFD54F;outline-offset:1px}
.gl.mic-on{--g:#C62828!important}
.mt.aqui{outline:3px solid #FFD54F;outline-offset:1px}
.sbar{background:#0D3B85;color:#fff;font-size:14px;padding:6px max(2vw,12px);display:flex;justify-content:space-between;gap:10px}
.shead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:8px max(2vw,12px);background:#fff;border-bottom:4px solid #1565C0;position:sticky;top:0;z-index:20;box-shadow:0 2px 10px rgba(13,59,133,.12)}
.sbrand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#0D3B85}
.sbrand img{width:62px;height:auto;filter:drop-shadow(0 2px 3px rgba(0,0,0,.25))}
.sbrand small{display:block;font-size:14px;color:#0D3B85}
.sbrand b{display:block;font-family:"Baloo 2",Arial;font-weight:800;font-size:28px;line-height:1;color:#0D3B85}
.sbrand em{display:block;font-style:normal;font-size:14px;color:#1565C0}
.shero{margin:0 calc(50% - 50vw);padding:34px max(4vw,16px) 38px;background:radial-gradient(1200px 500px at 80% 10%,#2D7FE0 0%,transparent 60%),linear-gradient(135deg,#0B2F6E 0%,#0D3B85 45%,#1565C0 100%);color:#fff;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:28px;align-items:center}
.fcard{display:flex;gap:12px;align-items:center;border:2px solid #E0E6EE;border-radius:16px;padding:10px 12px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.fcard p{margin:0;font-size:16px}
.fic{flex:none;width:52px;height:52px;border-radius:14px;display:grid;place-items:center}
.etl{list-style:none;padding:0;display:grid;gap:8px}
.etl li{display:flex;gap:12px;align-items:flex-start;font-size:17px}
.etl .en{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:800 20px "Baloo 2",Arial}
.ghead .tn svg{display:block}
@media (max-width:1000px){
 .shero{grid-template-columns:1fr}
}
@media (max-width:899px){
 .mosaic{justify-content:flex-start;flex-wrap:nowrap;overflow-x:auto}
 .mosaic .mt{flex:none}
 .sbrand b{font-size:22px}
 .sbrand img{width:48px}
}

 .mt.big{min-height:96px}
}

/* ---------- AGREGADOS: 4 MOMENTOS, 7 ETAPAS, GRADOS, DOCENTE ---------- */
.prefs{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
.prefs .chip{min-width:52px;justify-content:center}
.tb.sm{min-height:40px;padding:4px 10px;font-size:15px}
select.gsel{font:bold 16px Arial;min-height:44px;border:2.5px solid var(--ink);border-radius:12px;padding:4px 8px;background:#fff}
.moms{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:2px solid var(--ink)}
.moms button small{display:none}
.moms button{border:0;border-right:2px solid var(--ink);background:#fff;padding:4px 2px;font-weight:bold;line-height:1.1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px}
.moms button:last-child{border-right:0}
.moms button small{font-weight:normal;font-size:11.5px;color:var(--mut)}
.moms button .mn{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;border:2.5px solid var(--c);color:var(--c);font-size:13px}
.moms button.on{background:var(--c);color:#fff}
.moms button.on small{color:#fff}
.moms button.on .mn{background:#fff;border-color:#fff}
.etps{display:flex;gap:4px;padding:5px 8px;border-bottom:2px solid var(--ink);background:var(--soft);overflow-x:auto}
.etps button{flex:1 0 auto;border:2px solid var(--c);border-radius:999px;background:#fff;font-weight:bold;padding:2px 10px;white-space:nowrap}
.etps button.vis{background:#E8F5E9}
.etps button.on{background:var(--c);color:#fff;box-shadow:none}
.etps button .en{display:none}
.etps button.on .en{display:inline}
.say{flex:none;width:40px;height:40px;border-radius:50%;border:2.5px solid var(--B);background:#fff;color:var(--B);font-size:15px;display:inline-grid;place-items:center;padding:0;vertical-align:middle}
.sayrow{display:flex;gap:10px;align-items:flex-start;background:#E3F2FD;border-radius:12px}
.sayrow p{margin:0;flex:1}
.recu{border-left:8px solid var(--P);background:#F3E5F5;border-radius:0 12px 12px 0;padding:10px 12px;margin:4px 0 12px}
details.parte{border:3px solid var(--c);border-radius:12px;margin:8px 0;background:#fff}
details.parte summary{cursor:pointer;font-weight:bold;list-style:none;display:flex;gap:8px;align-items:center}
details.parte summary::before{content:"?";display:inline-grid;place-items:center;border-radius:50%;background:var(--c);color:#fff;flex:none}
details.parte[open] summary::before{content:"✓"}
details.parte p{padding:0 12px 10px;margin:0}
.quiz{border:3px dashed var(--c);border-radius:14px;padding:12px;margin:14px 0}
.quiz>b{display:block;font-size:18px;margin-bottom:6px}
.opt{display:block;width:100%;text-align:left;border:2.5px solid var(--ink);border-radius:12px;background:#fff;padding:10px 12px;margin:6px 0;font-weight:bold;font-size:16px;min-height:48px}
.opt small{display:block;font-weight:normal;color:var(--mut);font-size:14px}
.opt.ok{background:#E8F5E9;border-color:var(--G)}
.opt.mid{background:#FFF8E1;border-color:var(--Y)}

/* ---------- tema oscuro (NoteKiebres) ---------- */
html[data-tema="oscuro"]{color-scheme:dark;--ink:#E6EBF7;--mut:#B8C2DC;--bg:#0E1630;--soft:#1B2747}
html[data-tema="oscuro"] body{background:#0E1630;color:#E6EBF7}

html[data-tema="oscuro"] header.top{background:#0E1630;border-bottom:1px solid #26324F}

html[data-tema="oscuro"] .brand span:nth-child(2),html[data-tema="oscuro"] .nkh h1 span:nth-child(2){color:#64B5F6}
html[data-tema="oscuro"] .nks{color:#CE93D8}

html[data-tema="oscuro"] .momw span:nth-of-type(2){color:#64B5F6!important}
html[data-tema="oscuro"] .momw span:nth-of-type(3){color:#81C784!important}
html[data-tema="oscuro"] .momw span:nth-of-type(4){color:#CE93D8!important}
html[data-tema="oscuro"] .momw{text-shadow:0 0 18px rgba(255,255,255,.12)}
html[data-tema="oscuro"] .mfl{color:#5C6B8F}
html[data-tema="oscuro"] .frow .fcard{background:#16213F;border-radius:16px;padding:14px 10px}
html[data-tema="oscuro"] .temas{border-color:#26324F}
html[data-tema="oscuro"] .temab{color:#B8C2DC}
html[data-tema="oscuro"] .temab.on{background:#E6EBF7;color:#0E1630}
html[data-tema="oscuro"] :is(.tb,.chip,.card,details.doc,.box,.rq,.rq .ri,.sit,.opt,.quiz,.form,.dlg,.fcard,.flist li,.evsum div,.evc,.evc .lv3 button,.five li,.side,.bh,.tools,.moms button,.selbar,.pane,select,input,textarea,.fsel select,.say,details.parte,.vzbar,.cifras div,.etps button,.pal li){background-color:#16213F!important;color:#E6EBF7}
html[data-tema="oscuro"] :is(.tb,.chip,.card,details.doc,.opt,.dlg,.side,.bh,.tools,.moms button,select,input,textarea){border-color:#3A4A72}
html[data-tema="oscuro"] .tb:hover{background:#1E2B52!important}
html[data-tema="oscuro"] .tb.on,html[data-tema="oscuro"] .moms button.on,html[data-tema="oscuro"] .etps button.on,html[data-tema="oscuro"] .chip.on,html[data-tema="oscuro"] .rq.on{background:var(--c)!important;color:#fff!important}
html[data-tema="oscuro"] .tb.pri{background:var(--c)!important;color:#fff}
html[data-tema="oscuro"] :is(.sayrow,.recu,.pista,.lect,.ex,.rt.ok,.rt.mid,.rt.bad,.aeval,.box.tip,.box.ok,.box.no,.nd){background:#1B2747!important;color:#E6EBF7!important}
html[data-tema="oscuro"] :is(.t,.evt) :is(th,td){background:#16213F;color:#E6EBF7;border-color:#3A4A72}
html[data-tema="oscuro"] .card .th,html[data-tema="oscuro"] .fth{background:#fff}

html[data-tema="oscuro"] .aviso-nota{background:#2A2410;color:#FFE8A3;border-left-color:#F9A825}
html[data-tema="oscuro"] .aviso-espacio{background:#3A1418;color:#FFD9DC}
.familia-filtros{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
.familia-filtros .chip{text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.sigue-tarjetas{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.sigue-tarjeta{display:flex;flex-direction:column;gap:6px;border:3px solid var(--c);border-radius:14px;padding:12px 14px}
.sigue-tarjeta small{font-weight:bold;text-transform:uppercase;letter-spacing:.4px;color:var(--c);font-size:13px}
.sigue-tarjeta b{font-size:19px}
.sigue-tarjeta a{text-decoration:none}
.sigue-tarjeta .tb{align-self:flex-start}
.aviso-nota{font-size:15px;background:#FFF8E1;border-left:5px solid #F9A825;border-radius:8px;padding:8px 12px;margin:10px 0;color:#3E2C00}
.aviso-indicador{max-width:1010px;margin:12px auto}
.aviso-espacio{background:#FFEBEE;border:2px solid #C62828;border-radius:12px;padding:10px 14px;margin:12px 0;font-size:16px;color:#5B0F0F}
.clase-hoy{font-size:16px;margin:0 0 10px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.clase-hoy small{flex-basis:100%;color:var(--mut);font-size:14px}
.horario-fila{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}
.horario-fila select,.horario-fila input{font-size:16px;padding:4px 6px}
.toast.abajo{top:auto!important;bottom:84px!important}
.para-que{display:block;font-size:14.5px;margin:4px 0 2px;color:var(--ink)}
@media (max-width:700px){
 .tools{flex-wrap:wrap}
 .toast{top:auto!important;bottom:72px!important}
 .micf{width:46px!important;height:46px!important;right:8px!important;bottom:8px!important;opacity:.92}
 .micf svg{width:24px;height:24px}
 .wrapw{padding-bottom:64px}
 .nkgo h2{font-size:20px}
}
@media print{
 .nkgo,.aviso-nota,.aviso-espacio,.clase-hoy{display:none}
}

<body>
<div id="app"></div>
<div class="modal" id="modal"></div>
<div class="toast" id="toast"></div>
<script>
/* =====================================================================
   CONTENIDO EDITABLE (organizadores, familias, rutas, preguntas)
   Se edita aquí, en fuente/motor.html, con cualquier editor de texto
   (por ejemplo, el Bloc de notas). Después se corre fuente/construir.py
   para generar las tres aplicaciones.
   Reglas para editar sin romper nada:
   - Cambie solo el texto que está entre comillas.
   - Conserve las comas al final de cada línea y las llaves { } y corchetes [ ].
   - Un texto puede ser uno solo para todos los grados, o tres versiones:
       { b1: 'para 1.º y 2.º', b2: 'para 3.º y 4.º', b3: 'para 5.º y 6.º' }
   ===================================================================== */
window.OYA = {

  /* LAS 5 FAMILIAS de la «Guía práctica para aprender a organizar información».
     nombre: como aparece en la guía · proposito: lo que se pregunta en la etapa «Identifico»
     icono: un emoji · color: el color de la familia */
  familias: [
    { id: 'explorar', nombre: 'Explorar ideas y comprender palabras',      proposito: 'Reunir ideas, relacionar conceptos o entender una palabra', icono: '💡', color: 'var(--c1)' },
    { id: 'comparar', nombre: 'Comparar y registrar información',          proposito: 'Comparar cosas o registrar datos',                          icono: '⚖️', color: 'var(--c3)' },
    { id: 'ordenar',  nombre: 'Ordenar hechos, procesos y relatos',        proposito: 'Ordenar pasos, hechos o una historia',                      icono: '🔢', color: 'var(--c2)' },
    { id: 'explicar', nombre: 'Explicar, investigar y tomar decisiones',   proposito: 'Explicar por qué pasa algo, resolver un problema o decidir', icono: '🔍', color: 'var(--c5)' },
    { id: 'estudiar', nombre: 'Estudiar y comunicar',                      proposito: 'Investigar, estudiar o compartir lo aprendido',             icono: '📢', color: 'var(--c8)' }
  ],

  /* Los 4 momentos y las 7 etapas de Construir */
  momentos: [
    { id: 'reconocer',  nombre: 'Reconoce',   ayuda: 'Qué es y para qué sirve' },
    { id: 'comprender', nombre: 'Comprende',  ayuda: 'Sus partes y cómo se relacionan' },
    { id: 'construir',  nombre: 'Construye',   ayuda: 'Organizar información' },
    { id: 'elegir',     nombre: 'Elige',      ayuda: 'Cuándo usarlo y por qué' }
  ],
  etapas: [
    { id: 'comprendo',  nombre: '1. Comprendo' },
    { id: 'identifico', nombre: '2. Identifico' },
    { id: 'preparo',    nombre: '3. Preparo' },
    { id: 'construyo',  nombre: '4. Construyo' },
    { id: 'reviso',     nombre: '5. Reviso' },
    { id: 'explico',    nombre: '6. Explico' },
    { id: 'conservo',   nombre: '7. Conservo' }
  ],

  /* ===================================================================
     PRIMERO PIENSA, DESPUÉS DIBUJA (ruta para elegir de la guía)
     Preguntas de la pantalla de inicio. pruebaCon: organizadores que se recomiendan.
     =================================================================== */
  ruta: [
    { id: 'p1', familia: 'explorar', icono: '💡', pregunta: '¿Quiero reunir muchas ideas sobre un tema?', respuesta: 'Sí; todavía estoy explorando.', pruebaCon: ['telarana', 'mapa_mental'] },
    { id: 'p2', familia: 'explorar', icono: '🔗', pregunta: '¿Quiero explicar cómo se conectan los conceptos?', respuesta: 'Sí; necesito mostrar relaciones con palabras.', pruebaCon: ['mapa_conceptual'] },
    { id: 'p3', familia: 'explorar', icono: '🗂️', pregunta: '¿Hay un tema principal y varios subtemas?', respuesta: 'Sí; la información va de lo general a lo particular.', pruebaCon: ['sinoptico', 'arbol_clasificacion'] },
    { id: 'p4', familia: 'explorar', icono: '📖', pregunta: '¿Quiero entender a fondo una palabra?', respuesta: 'Sí; necesito explicar qué significa y qué cosas no pertenecen a esa idea.', pruebaCon: ['frayer'] },   // agregada con la «pista para elegirlo» de la guía
    { id: 'p5', familia: 'explorar', icono: '📰', pregunta: '¿Necesito los datos básicos de un hecho o una noticia?', respuesta: 'Sí; quiero saber quién, qué, dónde, cuándo, por qué y cómo.', pruebaCon: ['preguntas_5w'] },   // agregada con la «pista para elegirlo» de la guía
    { id: 'p6', familia: 'comparar', icono: '⚖️', pregunta: '¿Quiero encontrar semejanzas y diferencias?', respuesta: 'Sí; compararé dos o más elementos.', pruebaCon: ['comparativo', 'venn'] },
    { id: 'p7', familia: 'comparar', icono: '↔️', pregunta: '¿Solo necesito separar la información en dos lados?', respuesta: 'Sí; voy a contrastar dos aspectos sencillos.', pruebaCon: ['cuadro_t'] },   // agregada con la «pista para elegirlo» de la guía
    { id: 'p8', familia: 'comparar', icono: '🧩', pregunta: '¿Necesito cruzar dos tipos de información?', respuesta: 'Sí; quiero ver qué sucede en cada combinación.', pruebaCon: ['doble_entrada'] },   // agregada con la «pista para elegirlo» de la guía
    { id: 'p9', familia: 'comparar', icono: '📊', pregunta: '¿Quiero presentar datos numéricos?', respuesta: 'Sí; hay cantidades que comparar.', pruebaCon: ['tablas'] },
    { id: 'p10', familia: 'ordenar', icono: '🔢', pregunta: '¿Necesito ordenar hechos, fechas o pasos?', respuesta: 'Sí; el orden importa.', pruebaCon: ['cadena', 'linea_tiempo', 'flujo'] },
    { id: 'p11', familia: 'ordenar', icono: '🔄', pregunta: '¿Necesito mostrar algo que se repite?', respuesta: 'Sí; vuelve a empezar.', pruebaCon: ['ciclo'] },
    { id: 'p12', familia: 'ordenar', icono: '📚', pregunta: '¿Quiero entender o contar una historia?', respuesta: 'Sí; tiene personajes, un problema y un final.', pruebaCon: ['mapa_historia', 'storyboard'] },   // agregada con la «pista para elegirlo» de la guía
    { id: 'p13', familia: 'explicar', icono: '❓', pregunta: '¿Quiero explicar por qué pasó algo?', respuesta: 'Sí; busco causas y consecuencias.', pruebaCon: ['causa_efecto', 'espina'] },
    { id: 'p14', familia: 'explicar', icono: '🛠️', pregunta: '¿Hay un problema que necesita opciones?', respuesta: 'Sí; debo proponer o elegir soluciones.', pruebaCon: ['problema_solucion', 'arbol_decisiones'] },
    { id: 'p15', familia: 'explicar', icono: '👍', pregunta: '¿Quiero revisar una idea antes de decidir?', respuesta: 'Sí; quiero ver lo positivo, lo negativo y lo interesante.', pruebaCon: ['pmi'] },   // agregada con la «pista para elegirlo» de la guía
    { id: 'p16', familia: 'estudiar', icono: '🔍', pregunta: '¿Voy a investigar un tema con mis propias preguntas?', respuesta: 'Sí; quiero anotar lo que sé, lo que quiero saber y lo que aprendí.', pruebaCon: ['kwl'] },   // agregada con la «pista para elegirlo» de la guía
    { id: 'p17', familia: 'estudiar', icono: '📝', pregunta: '¿Necesito tomar apuntes para estudiar?', respuesta: 'Sí; voy a escuchar una explicación o leer un texto informativo.', pruebaCon: ['cornell'] },   // agregada con la «pista para elegirlo» de la guía
    { id: 'p18', familia: 'estudiar', icono: '📢', pregunta: '¿Quiero enseñar lo esencial de un tema a otras personas?', respuesta: 'Sí; voy a comunicar lo aprendido.', pruebaCon: ['infografia'] }
  ],

  /* SI DUDAS ENTRE… (tabla de la guía): cuándo elegir cada uno */
  dudas: [
    { titulo: 'Mapa mental / mapa conceptual', opciones: { mapa_mental: 'quieres reunir y recordar ideas mediante ramas, palabras clave e imágenes.', mapa_conceptual: 'necesitas mostrar relaciones precisas y leerlas con palabras de enlace.' } },
    { titulo: 'Cuadro sinóptico / árbol', opciones: { sinoptico: 'vas a resumir un tema en niveles de ideas y detalles.', arbol_clasificacion: 'vas a clasificar elementos en grupos y subgrupos según criterios.' } },
    { titulo: 'Cuadro comparativo / Venn', opciones: { comparativo: 'necesitas comparar varios criterios, quizá más de dos elementos.', venn: 'quieres destacar semejanzas en común y diferencias entre dos o tres elementos.' } },
    { titulo: 'Secuencia / línea del tiempo', opciones: { cadena: 'ordenas pasos o hechos sin necesitar fechas exactas.', linea_tiempo: 'las fechas y la duración de los acontecimientos importan.' } },
    { titulo: 'Secuencia / flujo / ciclo', opciones: { cadena: 'todos siguen un orden sencillo.', flujo: 'hay decisiones y caminos distintos.', ciclo: 'las etapas se repiten.' } },
    { titulo: 'Causa-efecto / espina de pescado', opciones: { causa_efecto: 'quieres conectar una o varias causas con sus efectos.', espina: 'quieres ordenar muchas causas posibles de un problema.' } },
    { titulo: 'Espina de pescado / problema-solución', opciones: { espina: 'investigas por qué puede estar ocurriendo un problema.', problema_solucion: 'además de comprenderlo, necesitas proponer y revisar acciones.' } },
    { titulo: 'Mapa de historia / storyboard', opciones: { mapa_historia: 'quieres analizar personajes, problema y desenlace.', storyboard: 'quieres representar escenas en orden mediante viñetas.' } },
    { titulo: 'Tabla / gráfica / infografía', opciones: { tablas: 'necesitas consultar datos exactos (tabla) o comparar y mostrar patrones (gráfica).', infografia: 'quieres comunicar una síntesis a otras personas combinando texto, datos e imágenes.' } }
  ],

  /* ===================================================================
     LOS 26 ORGANIZADORES
     num: número en la guía · familia: una de las 5 familias · corto: cómo se nombra dentro de una oración
     grado: en qué grado se introduce · recupera: organizadores que ya conocen
     guia: textos de la guía (también se conoce como, pista para elegirlo, evítalo como primera opción,
           cómo construirlo paso a paso y ejemplo resuelto). Se muestran al elegir desde la pantalla de inicio.
     constructor: tipo de plantilla interactiva (ver js/constructores.js)
     =================================================================== */
  organizadores: [

    /* ---------------- 1. TELARAÑA ---------------- */
    {
      id: 'telarana', num: 1, nombre: 'Telaraña o lluvia de ideas', corto: 'la telaraña', familia: 'explorar', grado: 1, recupera: [],
      usalo: 'reunir lo que sabes de un tema',
      guia: {
        tambien: 'red de ideas; mapa de araña',
        pista: 'Necesito soltar ideas y después agruparlas, sin explicar todavía todas las conexiones.',
        evitalo: 'No es el mejor formato para explicar una cadena de causas o una secuencia exacta; para eso usa causa-efecto o secuencia.',
        pasos: [
          'Escribe el tema en el centro o arriba de la hoja.',
          'Anota alrededor todas las ideas que surjan; al principio no las juzgues ni las ordenes.',
          'Une cada idea con el tema usando líneas o ramas.',
          'Agrupa las ideas parecidas y ponles un nombre si aparecen familias.',
          'Al terminar, marca las ideas que investigarás o conservarás.'
        ],
        ejemplo: 'TEMA: CUIDAR EL AGUA\n¿Dónde la usamos? → beber, lavarnos, regar\n¿Qué la desperdicia? → llave abierta, fugas\n¿Cómo cuidarla? → cerrar llave, reparar fugas\n¿Quién participa? → casa, escuela, comunidad'
      },
      constructor: 'radial', config: { etqCentro: 'Tema central', pregCentro: '¿Sobre qué tema vamos a pensar?', etqRama: 'Ideas', agregar: 'Agregar idea' },
      reconocer: {
        queEs: { b1: 'Es un dibujo con el tema en medio y muchas ideas alrededor.', b2: 'Es un organizador con un tema en el centro y las ideas que se nos ocurren unidas a él con líneas.', b3: 'Es un organizador que reúne, alrededor de un tema central, todas las ideas que el grupo conoce o se le ocurren, para después revisarlas y agruparlas.' },
        paraQue: { b1: 'Sirve para decir todo lo que sabemos de algo.', b2: 'Sirve para recordar lo que ya sabemos y juntar muchas ideas antes de leer o escribir.', b3: 'Sirve para activar conocimientos previos y generar ideas antes de leer, investigar o escribir.' },
        ejemplo: { centro: 'Los perros', ramas: [ { texto: 'Tienen cuatro patas', sub: [] }, { texto: 'Ladran', sub: [] }, { texto: 'Comen croquetas', sub: [] }, { texto: 'Son mascotas', sub: [] }, { texto: 'Tienen pelo', sub: [] } ] },
        pregunta: { texto: '¿Para qué sirve la telaraña?', opciones: [ { t: 'Para reunir muchas ideas sobre un tema', ok: true }, { t: 'Para decir qué pasó primero y qué pasó después' }, { t: 'Para contar cuántas cosas hay' } ], explicacion: 'La telaraña junta todas las ideas alrededor de un solo tema.' }
      },
      comprender: {
        partes: [
          { nombre: 'Tema central', desc: 'Va en el centro. Es aquello sobre lo que pensamos.' },
          { nombre: 'Ideas', desc: 'Cada círculo o tarjeta lleva una sola idea.' },
          { nombre: 'Líneas', desc: 'Unen cada idea con el tema: muestran que la idea habla de él.' }
        ],
        pregunta: { texto: '¿Qué va en el centro de la telaraña?', opciones: [ { t: 'El tema', ok: true }, { t: 'La idea más larga' }, { t: 'El final de la historia' } ], explicacion: 'En el centro va el tema; las ideas van alrededor.' }
      },
      construir: {
        frases: [ '¿Qué sabes sobre este tema?', '¿Qué has visto o escuchado?', '¿Qué otras ideas se relacionan con él?', '¿Cuáles ideas se parecen entre sí?' ],
        revision: [ '¿Todas las ideas hablan del tema del centro?', '¿Hay ideas repetidas?', '¿Cada tarjeta tiene una sola idea?' ],
        explico: [ '¿Qué idea nueva escuchaste hoy?', '¿Qué ideas se parecen entre sí? ¿Por qué?' ]
      },
      docente: {
        reconocer: 'Muestre el ejemplo y pregunte al grupo qué observan en el centro y alrededor antes de leer la definición.',
        comprender: 'Pulse cada parte para descubrirla. Pida a un alumno que señale cada parte en el ejemplo.',
        construir: 'Escriba las ideas tal como las dicen los alumnos. Al final, pregunte cuáles se parecen para preparar el mapa mental de 3.º.',
        elegir: 'Pida que expliquen por qué la telaraña sirve en esa situación y otro organizador no.'
      }
    },

    /* ---------------- 2–7 (se completan en las siguientes etapas) ---------------- */
    /* ---------------- 2. MAPA MENTAL ---------------- */
    {
      id: 'mapa_mental', num: 2, nombre: 'Mapa mental', corto: 'el mapa mental', familia: 'explorar', grado: 3, recupera: ['telarana'],
      usalo: 'ordenar ideas en ramas principales y detalles',
      guia: {
        tambien: 'mapa radial',
        pista: 'Tengo un tema central y quiero abrirlo en varias ramas para recordar sus partes.',
        evitalo: 'A diferencia del mapa conceptual, el mapa mental no necesita palabras de enlace en cada línea. No conviertas cada rama en un párrafo.',
        pasos: [
          'Coloca el tema principal en el centro.',
          'Dibuja ramas gruesas para las ideas principales.',
          'Agrega ramas más pequeñas con detalles, ejemplos o palabras clave.',
          'Usa un color por rama y dibujos sencillos que ayuden a recordar.',
          'Revisa que cada rama sí pertenezca al tema y que no haya frases demasiado largas.'
        ],
        ejemplo: 'ANIMALES\n  ├─ Según dónde viven: tierra / agua / aire\n  ├─ Según lo que comen: herbívoros / carnívoros / omnívoros\n  └─ Según su cuerpo: con columna / sin columna\n(En el mapa, cada grupo sería una rama con subramas.)'
      },
      constructor: 'radial', config: { sub: true, etqCentro: 'Tema central', pregCentro: '¿Cuál es el tema?', etqRama: 'Ramas principales' },

        pregunta: { texto: '¿Qué tiene el mapa mental que no tiene la telaraña?', opciones: [ { t: 'Ramas con detalles (ramitas)', ok: true }, { t: 'Un tema en el centro' }, { t: 'Líneas' } ], explicacion: 'Los dos tienen un tema central; el mapa mental además ordena detalles en cada rama.' }

          { nombre: 'Ramas principales', desc: 'Las ideas más importantes del tema.' },
          { nombre: 'Ramas secundarias', desc: 'Los detalles de cada idea principal.' },
          { nombre: 'Palabras clave', desc: 'Palabras cortas que resumen cada idea.' },
          { nombre: 'Colores', desc: 'Cada rama tiene un color para distinguirla.' }
        ],
        pregunta: { texto: '«Cuentos» es un detalle de la rama…', opciones: [ { t: 'Libros', ok: true }, { t: 'Reglas' }, { t: 'Espacios' } ], explicacion: 'Los cuentos son un tipo de libro.' }
      },
      construir: {
        frases: [ '¿Cuáles son las ideas más importantes?', '¿Qué detalles pertenecen a esta idea?', '¿Qué palabra corta puede representar esta información?', '¿Cada detalle está en la rama correcta?' ],
        revision: [ '¿Cada rama principal es una idea importante del tema?', '¿Los detalles están en la rama que les corresponde?', '¿Usamos palabras clave y no oraciones largas?' ],
        explico: [ '¿Por qué elegiste esas ramas principales?', '¿Qué rama tiene más información? ¿Por qué?' ]
      },
      docente: {
        reconocer: 'Muestre primero una telaraña sobre el mismo tema y pregunte qué cambió.',
        comprender: 'Pida que identifiquen qué es principal y qué es detalle antes de construir.',
        construir: 'Si el grupo tiene una telaraña previa, úsela como punto de partida: agrupen las ideas en ramas.',
        elegir: 'Prepara el mapa conceptual de 4.º, que además nombra las relaciones.'
      }
    },
    /* ---------------- 3. MAPA CONCEPTUAL ---------------- */
    {
      id: 'mapa_conceptual', num: 3, nombre: 'Mapa conceptual', corto: 'el mapa conceptual', familia: 'explorar', grado: 4, recupera: ['mapa_mental'],
      usalo: 'explicar cómo se relacionan varios conceptos',
      guia: {
        tambien: 'red conceptual',
        pista: 'Quiero explicar qué relación existe entre conceptos y poder leer las conexiones como oraciones.',
        evitalo: 'No es solo un mapa de palabras: las palabras de enlace son esenciales. Si solo salen ramas con ejemplos, quizá estás haciendo un mapa mental.',
        pasos: [
          'Identifica la pregunta que quieres responder.',
          'Selecciona los conceptos importantes y escríbelos con pocas palabras.',
          'Ordena los conceptos de lo general a lo particular.',
          'Únelos con líneas o flechas y escribe palabras de enlace: necesita, se divide en, produce, pertenece a.',
          'Lee cada conexión como una oración y corrige las que no tengan sentido.'
        ],
        ejemplo: 'LAS PLANTAS\n   ↓ necesitan\nAGUA — LUZ SOLAR — AIRE\n   ↓ utilizan para\nCRECER Y PRODUCIR SU ALIMENTO\nEjemplo de lectura: “Las plantas necesitan agua”.'
      },
      constructor: 'conceptual', config: { banco: ['es', 'tiene', 'necesita', 'produce', 'se divide en', 'por ejemplo', 'sirve para', 'está formado por'] },
      reconocer: {

window.OYA_LECTURAS = {
  1: { titulo: 'El agua en mi casa', grado: '1.º y 2.º', texto: 'En mi casa usamos agua todos los días. En la mañana me lavo la cara y los dientes. Mi mamá cocina la sopa con agua. Mi hermano riega las plantas del patio. En la tarde lavamos los trastes y la ropa. También tomamos agua cuando tenemos sed.\nA veces la llave se queda abierta y el agua se va. Mi abuelo dice que el agua es muy valiosa y que hay que cuidarla.', consigna: 'Escribe AGUA en el centro. Alrededor, pon todas las ideas que encuentres en la lectura.' },
  2: { titulo: 'La milpa', grado: '3.º y 4.º', texto: 'La milpa es una forma de sembrar que se usa en México desde hace miles de años. En el mismo terreno crecen juntas varias plantas: el maíz, el frijol y la calabaza; muchas veces también el chile.\nCada planta ayuda a las otras. El maíz crece alto y el frijol se enreda en él para subir. El frijol deja en la tierra sustancias que la vuelven más fértil. Las hojas grandes de la calabaza dan sombra al suelo, guardan la humedad y no dejan crecer tanta hierba.\nDe la milpa salen tortillas, tamales, frijoles, calabacitas y flores de calabaza. Por eso las familias del campo cuidan la milpa: la siembran en temporada de lluvias, la deshierban y celebran la cosecha.', consigna: 'Pon LA MILPA al centro y abre ramas gruesas: sus plantas, cómo se ayudan, qué alimentos da y cómo se cuida.' },
  3: { titulo: '¿Cómo se alimentan las plantas?', grado: '4.º a 6.º', texto: 'Las plantas no comen como los animales: ellas fabrican su propio alimento. Para hacerlo necesitan agua, luz del sol y aire.\nLas raíces absorben el agua del suelo. El agua sube por el tallo hasta las hojas. Las hojas toman del aire un gas llamado dióxido de carbono. Con la energía de la luz del sol, las hojas transforman el agua y el dióxido de carbono en azúcares, que son su alimento. A este proceso se le llama fotosíntesis.\nDurante la fotosíntesis las plantas liberan oxígeno, el gas que los seres vivos necesitamos para respirar.', consigna: 'Responde con tu mapa: ¿cómo fabrican su alimento las plantas? Usa palabras de enlace como «necesitan», «absorben» o «producen».' },
  4: { titulo: 'Los textos que leemos', grado: '4.º a 6.º', texto: 'En la biblioteca hay muchos tipos de textos y cada uno tiene un propósito.\nLos textos narrativos cuentan historias; por ejemplo, los cuentos, las fábulas y las leyendas. Tienen personajes, un lugar, un problema y un final.\nLos textos informativos explican cómo es algo o por qué sucede; por ejemplo, las enciclopedias, las noticias y los artículos de divulgación.\nLos textos instructivos dicen cómo hacer algo paso a paso; por ejemplo, las recetas y los instructivos de juegos.\nLos textos poéticos juegan con el ritmo y la rima de las palabras; por ejemplo, los poemas, las canciones y las adivinanzas.', consigna: 'Escribe el tema a la izquierda y abre llaves con los tipos de texto, su propósito y sus ejemplos.' },
  5: { titulo: '¿Cómo se mueven los animales?', grado: '2.º y 3.º', texto: 'Los animales se mueven de muchas maneras. Algunos caminan o corren con sus patas, como el perro, el caballo y la hormiga. Otros reptan, es decir, se arrastran con todo el cuerpo, como la serpiente y el caracol.\nHay animales que vuelan con alas, como el colibrí, la mariposa y el murciélago. Otros nadan con aletas o con todo el cuerpo, como el pez, el ajolote y el delfín.\nAlgunos animales se mueven de más de una forma: el pato camina, nada y vuela.', consigna: 'Arriba escribe ANIMALES. Usa la regla «¿cómo se mueven?» para hacer grupos y coloca ejemplos en cada uno.' },
  6: { titulo: 'El ajolote, un anfibio mexicano', grado: '4.º a 6.º', texto: 'Los anfibios son animales vertebrados que pasan parte de su vida en el agua y parte en la tierra, o que necesitan lugares húmedos para vivir. Su piel es delgada, húmeda y sin escamas, plumas ni pelo. La mayoría nace de huevos puestos en el agua y cambia de forma al crecer.\nSon anfibios la rana, el sapo, la salamandra y el ajolote. El ajolote vive en los canales de Xochimilco y es especial: aunque crece, conserva sus branquias y se queda en el agua toda su vida.\nNo son anfibios la tortuga ni el cocodrilo, que son reptiles y tienen escamas, ni el pez, que respira siempre por branquias y tiene escamas.', consigna: 'Escribe ANFIBIO al centro y completa: definición, características, ejemplos y no ejemplos.' },
  7: { titulo: 'Noticia escolar: llega la Feria del Libro', grado: '2.º a 4.º', texto: 'El viernes 14 de marzo se realizó la Feria del Libro en el patio de nuestra escuela. Participaron los seis grupos, las maestras, los maestros y muchas familias.\nCada grupo preparó un puesto con sus libros favoritos y los presentó a los visitantes. Los de primero contaron cuentos con títeres y los de sexto leyeron poemas en voz alta.\nLa feria se organizó para que todos conocieran los libros nuevos de la biblioteca y se animaran a llevarlos prestados a casa. Al final, la biblioteca prestó más libros que nunca.', consigna: 'Busca en la noticia: ¿qué pasó?, ¿quiénes participaron?, ¿dónde?, ¿cuándo?, ¿por qué? y ¿cómo?' },
  8: { titulo: 'El árbol de la escuela', grado: '1.º y 2.º', texto: 'En el patio de la escuela hay un árbol grande. Nos da sombra en el recreo y ahí viven unos pajaritos.\nAlgunas cosas le ayudan al árbol: regarlo cuando no llueve, poner tierra en sus raíces y cuidar que nadie lo maltrate.\nOtras cosas le hacen daño: arrancar sus hojas, colgarse de sus ramas, tirar basura junto a él y escribir en su tronco.', consigna: 'De un lado escribe LO QUE LE AYUDA y del otro LO QUE LE HACE DAÑO.' },
  9: { titulo: 'Tres animales de México', grado: '3.º y 4.º', texto: 'El ajolote vive en el agua dulce de los canales y lagos de Xochimilco. Come gusanos, insectos y pequeños peces. Se mueve nadando con su cola.\nEl jaguar vive en las selvas del sur de México. Come venados, pecaríes y otros animales que caza. Se mueve caminando y corriendo; también trepa árboles y nada muy bien.\nLa mariposa monarca vive en Canadá y en Estados Unidos durante el verano, y en invierno viaja a los bosques de Michoacán y del Estado de México. Cuando es oruga come hojas de algodoncillo; ya adulta, toma el néctar de las flores. Se mueve volando y recorre miles de kilómetros.', consigna: 'Compara a los tres animales con los mismos criterios: dónde viven, qué comen y cómo se mueven.' },
  10: { titulo: 'La rana y el sapo', grado: '2.º y 3.º', texto: 'La rana y el sapo se parecen mucho, pero no son iguales.\nLos dos son anfibios, nacen de huevos en el agua, primero son renacuajos y comen insectos.\nLa rana tiene la piel lisa y húmeda, y sus patas traseras son largas: por eso da saltos grandes. Vive casi siempre cerca del agua.\nEl sapo tiene la piel seca y con bolitas, y sus patas son más cortas: da saltos pequeños o camina. Puede vivir más lejos del agua.', consigna: 'En un círculo escribe lo que solo tiene la rana, en el otro lo que solo tiene el sapo y en el centro lo que comparten.' },
  11: { titulo: 'Los préstamos de la biblioteca', grado: '4.º a 6.º', texto: 'La biblioteca escolar llevó la cuenta de los libros que pidió prestados cada grupo durante una semana.\nEl lunes, 1.º pidió 8 libros, 3.º pidió 5 y 5.º pidió 3. El miércoles, 1.º pidió 6, 3.º pidió 9 y 5.º pidió 4. El viernes, 1.º pidió 10, 3.º pidió 7 y 5.º pidió 12.\nLa bibliotecaria quiere saber qué grupo lee más y qué día se prestan más libros, para organizar mejor los horarios.', consigna: 'En las filas pon los grupos y en las columnas los días. Llena cada casilla con el número de libros.' },
  12: { titulo: 'La fruta favorita del grupo', grado: '1.º a 3.º', texto: 'En el grupo de 2.º A preguntamos a cada niña y a cada niño cuál es su fruta favorita.\nEl mango ganó con 9 votos. El plátano tuvo 6 votos. La sandía tuvo 5 votos. La manzana tuvo 4 votos. La naranja tuvo 2 votos.\nEn total votaron 26 alumnos.', consigna: 'Registra los votos en la tabla y después haz la gráfica. ¿Qué fruta ganó? ¿Cuál tuvo menos votos?' },
  13: { titulo: 'Sembramos un frijol', grado: '1.º y 2.º', texto: 'Primero pusimos algodón en un vaso de plástico.\nDespués colocamos un frijol sobre el algodón y le echamos un poco de agua.\nLuego dejamos el vaso junto a la ventana, donde le da la luz.\nA los pocos días el frijol se abrió y salió una raíz blanca.\nDespués creció un tallito con dos hojas verdes.\nAl final, pasamos la plantita a una maceta con tierra.', consigna: 'Ordena en la cadena lo que pasó: primero, después, luego y al final.' },
  14: { titulo: 'Momentos de la Revolución Mexicana', grado: '3.º a 6.º', texto: 'Porfirio Díaz gobernó México por más de treinta años. Muchas personas querían elecciones libres y un reparto justo de la tierra.\nEl 20 de noviembre de 1910, siguiendo el llamado de Francisco I. Madero en el Plan de San Luis, comenzó la lucha armada.\nEn mayo de 1911 Porfirio Díaz renunció y salió del país. Madero fue elegido presidente ese mismo año.\nEn febrero de 1913, Madero fue asesinado y Victoriano Huerta tomó el poder; Venustiano Carranza, Francisco Villa y Emiliano Zapata, entre otros, siguieron luchando.\nEl 5 de febrero de 1917 se promulgó la Constitución que sigue vigente en México.\nHacia 1920 terminó la etapa más violenta de la Revolución.', consigna: 'Coloca cada hecho en la línea del tiempo según su fecha. Deja más espacio entre los años más separados.' },
  15: { titulo: '¿Cómo pido un libro prestado?', grado: '4.º a 6.º', texto: 'Para llevarte un libro de la biblioteca a tu casa, primero eliges el libro que te interesa.\nDespués vas al mostrador. La bibliotecaria pregunta si tienes tu credencial. Si no la tienes, primero debes tramitarla con tu maestra o maestro. Si sí la tienes, revisa si el libro está disponible para préstamo.\nSi el libro es solo de consulta, lo puedes leer en la biblioteca, pero no llevártelo. Si sí se presta, la bibliotecaria anota tu nombre y la fecha de entrega.\nAl final, te llevas el libro y lo devuelves en una semana.', consigna: 'Dibuja los pasos con rectángulos y las preguntas con rombos. De cada rombo salen dos caminos: SÍ y NO.' },
  16: { titulo: 'La vida de la mariposa monarca', grado: '2.º y 3.º', texto: 'La mariposa monarca pone sus huevos debajo de las hojas del algodoncillo.\nDel huevo nace una oruga con rayas amarillas, negras y blancas. La oruga come hojas y crece muy rápido.\nCuando está grande, la oruga se cuelga de una rama y forma una crisálida verde, como una cajita.\nDentro de la crisálida, el cuerpo cambia. Unos días después sale una mariposa con alas naranjas y negras.\nLa mariposa adulta busca pareja y pone nuevos huevos. Así el ciclo vuelve a empezar.', consigna: 'Coloca en círculo las etapas: huevo, oruga, crisálida y mariposa. Une cada una con flechas.' },
  17: { titulo: 'Tito y la luna', grado: '1.º y 2.º', texto: 'Tito era un conejo que vivía en el bosque, junto a un río. Cada noche miraba la luna y quería tocarla.\nUn día subió a la piedra más alta, pero la luna seguía lejos. Se puso triste.\nSu amiga la tortuga le dijo: «Ven al río». Tito se asomó al agua y ahí estaba la luna, brillante y cerquita.\nTito tocó el agua con su pata y la luna se movió como si bailara. Desde entonces, Tito visita el río cada noche para jugar con la luna.', consigna: 'Completa el mapa: personajes, lugar, problema, lo que pasó y el final.' },
  18: { titulo: 'La semilla viajera', grado: '2.º a 4.º', texto: 'Una semilla de diente de león vivía en una flor del jardín de la escuela. Un día sopló un viento fuerte y la semilla salió volando con su paraguas blanco.\nVoló sobre el patio, pasó junto a la ventana del salón de primero y casi cae en un charco.\nPor fin aterrizó en una maceta vacía de la biblioteca. Una niña la regó durante varios días.\nPoco a poco brotó una plantita y, en primavera, se abrió una flor amarilla. Todos la llamaron «la flor viajera».', consigna: 'Divide la historia en escenas. Dibuja cada escena en una viñeta y escribe una frase corta debajo.' },
  19: { titulo: '¿Por qué se secó la planta del salón?', grado: '1.º a 3.º', texto: 'En nuestro salón teníamos una planta junto a la puerta. Durante las vacaciones nadie la regó.\nAdemás, la puerta siempre estaba cerrada y la planta no recibía la luz del sol.\nCuando regresamos, la planta estaba seca: sus hojas estaban cafés y se caían.\nAhora la pusimos junto a la ventana y hicimos una lista de turnos para regarla.', consigna: 'Escribe las causas (¿por qué pasó?) y el efecto (¿qué pasó?). Une cada causa con su efecto con una flecha.' },
  20: { titulo: 'Basura en el patio', grado: '5.º y 6.º', texto: 'Después del recreo, el patio de la escuela queda lleno de basura. El grupo de 5.º investigó por qué ocurre.\nEncontraron que solo hay dos botes de basura para toda la escuela y que están lejos de donde comen los alumnos. Además, muchos botes no tienen tapa y el viento saca la basura.\nTambién observaron que algunos alumnos tiran las envolturas al piso por costumbre, y que no hay turnos para revisar el patio al final del recreo.\nPor último, notaron que en la cooperativa se venden muchos productos con envoltura de plástico.', consigna: 'Escribe el problema en la cabeza del pescado. Acomoda las causas en espinas: materiales, hábitos, organización y espacio.' },
  21: { titulo: 'El ruido en la biblioteca', grado: '3.º y 4.º', texto: 'Durante la hora de lectura, en la biblioteca hay mucho ruido. Los que quieren leer no se concentran y algunos se molestan.\nEl grupo platicó y descubrió que el ruido aumenta cuando entran dos grupos al mismo tiempo, cuando algunos juegan entre los estantes y cuando no saben qué libro escoger y se pasean.\nPropusieron varias soluciones: hacer un horario para que entre un grupo a la vez, poner una señal de «voz baja» y preparar una caja con libros recomendados para quien no sabe qué leer.', consigna: 'Escribe el problema, sus causas y las soluciones. Después elige la mejor solución y explica por qué.' },
  22: { titulo: 'Nuestro proyecto para la feria de ciencias', grado: '5.º y 6.º', texto: 'El equipo de 6.º tiene que elegir un proyecto para la feria de ciencias, que será en dos semanas.\nTienen tres ideas: construir un volcán que haga erupción, sembrar frijoles con distintas cantidades de luz, o hacer un filtro de agua con arena y piedras.\nPara decidir, se hacen preguntas: ¿Alcanza el tiempo? Los frijoles tardan unas tres semanas en crecer. ¿Tenemos los materiales? Para el filtro necesitan botellas, arena, grava y algodón, y ya los tienen. ¿Es seguro? Para el volcán usarían vinagre y bicarbonato, que son seguros, pero el volcán ya lo presentaron otros grupos el año pasado.', consigna: 'Escribe la decisión arriba. Usa preguntas de filtro (tiempo, materiales, seguridad) para llegar a la mejor opción.' },
  23: { titulo: 'Propuesta: recreo con juegos organizados', grado: '3.º a 6.º', texto: 'El consejo de alumnos propone que un día a la semana el recreo tenga juegos organizados: cuerda, avión, canicas y juegos de mesa en el patio.\nAlgunos opinan que es buena idea porque habría menos empujones, más niños jugarían juntos y se aprenderían juegos tradicionales.\nOtros piensan que no les gustaría que les digan a qué jugar, que faltarían materiales y que alguien tendría que cuidar los juegos.\nTambién hay cosas interesantes que pensar: ¿podrían organizarlo los alumnos de sexto?, ¿qué juegos elegirían los más pequeños?', consigna: 'Ordena las opiniones en tres columnas: Positivo, Negativo e Interesante. Después decide si apoyas la propuesta.' },
  24: { titulo: 'El ajolote', grado: '1.º a 4.º', texto: 'El ajolote es un animal que solo vive en México, en los canales de Xochimilco, en la Ciudad de México.\nTiene la piel suave, cuatro patas cortas y una cola larga para nadar. Alrededor de su cabeza tiene unas ramitas: son sus branquias, con las que respira dentro del agua.\nPuede volver a formar partes de su cuerpo si se lastima, por ejemplo una pata.\nHoy está en peligro de extinción porque el agua de los canales está sucia y hay peces que se comen a los ajolotes pequeños.', consigna: 'Antes de leer, escribe lo que ya sabes y lo que quieres saber. Después de leer, escribe lo que aprendiste.' },
  25: { titulo: 'Los volcanes de México', grado: '5.º y 6.º', texto: 'Un volcán es una abertura en la corteza de la Tierra por donde sale roca fundida, llamada magma, junto con gases y cenizas. Cuando el magma sale a la superficie se llama lava.\nEn México hay muchos volcanes porque el país está sobre zonas donde chocan placas de la corteza terrestre. Muchos forman el Eje Neovolcánico, que cruza el centro del país.\nEl Popocatépetl, entre Puebla, el Estado de México y Morelos, es uno de los volcanes más activos; a veces lanza ceniza y por eso se vigila todos los días.\nEl Paricutín, en Michoacán, nació en 1943 en el terreno de un campesino. En pocos días formó un cerro y su lava cubrió dos pueblos.', consigna: 'Toma notas a la derecha. A la izquierda escribe palabras clave y preguntas. Abajo, escribe un resumen de dos o tres líneas.' },
  26: { titulo: 'El agua en nuestra escuela', grado: '6.º', texto: 'El grupo de 6.º investigó cómo se usa el agua en la escuela durante una semana.\nContaron 4 llaves que goteaban en los baños. Con un vaso midieron que una llave que gotea puede tirar más de 20 litros de agua en un día.\nTambién preguntaron a 120 alumnos: 85 dijeron que cierran la llave mientras se enjabonan las manos y 35 dijeron que la dejan abierta.\nCon estos datos, el grupo quiere hacer un cartel para el periódico mural que invite a cuidar el agua, con datos, íconos y mensajes cortos.', consigna: 'Elige el dato más importante para ponerlo grande. Agrega íconos y micro-textos con mensajes cortos. Anota la fuente.' }

<details class="doc"><summary>Antes de empezar</summary><div class="in"><p>Un organizador gráfico es una representación visual que ayuda a seleccionar, ordenar y relacionar información. Puede usar palabras, dibujos, flechas, líneas, cuadros, símbolos o números. Su valor no está en que se vea bonito, sino en que permita entender algo y explicarlo con claridad.</p><p><b>Recuerda:</b> un mismo tema puede organizarse de varias maneras. La mejor opción depende de la pregunta que quieres responder y de la relación que necesitas mostrar.</p></div></details>
<details class="doc"><summary>¿En qué momento de una actividad lo puedo usar?</summary><div class="in scroll"><table class="t"><tr><th>Momento</th><th>Qué necesito hacer</th><th>Organizadores que pueden ayudar</th></tr>${MOM.map(m=>`<tr><td><b>${m[0]}</b></td><td>${m[1]}</td><td>${m[2].map(o).join('; ')}</td></tr>`).join('')}</table></div></details>
<details class="doc"><summary>Reglas de oro para niñas y niños</summary><div class="in"><ul><li>Primero entiendo la información; después elijo el dibujo que me ayudará.</li><li>Escribo palabras o frases cortas. Si necesito explicar mucho, puedo agregar una nota debajo.</li><li>Las flechas y las líneas tienen significado: debo poder decir qué relación muestran.</li><li>No todo cabe en todos los organizadores. Si la información no se acomoda, quizá necesito otro formato.</li><li>Puedo cambiar de organizador cuando mi pregunta cambie. No existe uno que sirva para todo.</li></ul></div></details>
<details class="doc"><summary>Cómo avanzar de 1.º a 6.º grado</summary><div class="in scroll"><table class="t"><tr><th>Grados</th><th>Apoyos y retos adecuados</th></tr>${Object.values(GRADOS).map(g=>`<tr><td><b>${g[0]}</b></td><td>${g[1]}</td></tr>`).join('')}</table></div></details>
<details class="doc"><summary>Accesibilidad: una misma meta, distintas formas de participar</summary><div class="in"><p>Para que todos puedan mostrar lo que comprenden, el docente puede ofrecer plantillas parcialmente completas, pictogramas, tarjetas movibles, letra grande, menos elementos por página, tiempo adicional, lectura en voz alta, dictado a un compañero o uso de tecnología de apoyo. También puede permitir respuestas con dibujos, palabras, señalamientos o explicación oral. El apoyo debe facilitar el pensamiento, no resolverlo por el alumno.</p><p><b>En esta app:</b> «Plantilla en blanco» deja la estructura sin texto; las viñetas aceptan íconos o dibujo libre; «Leer» lee el organizador en voz alta.</p><p><b>Importante:</b> no califiques la decoración, la cantidad de colores o la habilidad para dibujar. Evalúa si la información es correcta, pertinente, está bien organizada y el alumno puede explicar por qué la acomodó así.</p></div></details>
<details class="doc"><summary>No todos los organizadores hacen lo mismo</summary><div class="in scroll"><table class="t"><tr><th>Si dudas entre…</th><th>Elige este cuando…</th><th>Elige el otro cuando…</th></tr>${DUDAS.map(d=>`<tr><td><b>${d[1]}</b></td><td>${d[2]}</td><td>${d[3]}</td></tr>`).join('')}</table></div></details>
<details class="doc"><summary>Un mismo tema puede necesitar varios organizadores</summary><div class="in scroll"><p>Imagina que el grupo investiga cómo cuidar el agua en la escuela. Cada pregunta pide una herramienta distinta:</p><table class="t"><tr><th>Pregunta del grupo</th><th>Organizador posible</th><th>¿Por qué?</th></tr>${[['¿Qué sabemos sobre el agua?',[1,24],'Para recuperar ideas y formular preguntas.'],['¿Cómo se relacionan el agua, las plantas y los seres vivos?',[3],'Para explicar conexiones entre conceptos.'],['¿Qué acciones ahorran agua y cuáles la desperdician?',[8],'Para separar dos tipos de acciones.'],['¿Cuáles son las causas del desperdicio en la escuela?',[20],'Para organizar varias causas que se deben investigar.'],['¿Cuántas fugas observamos durante la semana?',[12],'Para registrar cantidades y compararlas.'],['¿Qué podemos hacer y cómo sabremos si funciona?',[21,15],'Para proponer acciones y planear su seguimiento.'],['¿Cómo compartimos lo que descubrimos?',[26],'Para comunicar los hallazgos con información breve y comprobable.']].map(r=>`<tr><td>${r[0]}</td><td>${r[1].map(o).join(' o ')}</td><td>${r[2]}</td></tr>`).join('')}</table></div></details>
<details class="doc"><summary>Cómo enseñar a elegir, no solo a copiar formatos</summary><div class="in"><ol><li><b>Modela en voz alta:</b> «La pregunta pide comparar; por eso elegiré una tabla con los mismos criterios». El alumnado necesita escuchar el razonamiento, no solo ver el dibujo terminado.</li><li><b>Resuelve un ejemplo entre todos:</b> primero decide el propósito, después selecciona la información y al final construye el organizador.</li><li><b>Ofrece dos formatos posibles</b> para la misma información y conversa sobre cuál comunica mejor y por qué.</li><li><b>Retira gradualmente las plantillas:</b> primero completa el grupo un modelo; después los alumnos eligen y construyen el suyo.</li><li><b>Pide una explicación final:</b> «Elegí este organizador porque…», «La información más importante es…» y «Lo cambiaría si…».</li></ol><p><b>Secuencia didáctica posible:</b> (1) el docente modela un organizador; (2) el grupo lo construye con información compartida; (3) equipos eligen entre dos formatos; (4) cada alumno justifica su elección; y (5) se revisa si el organizador ayudó a comprender, explicar o tomar una decisión.</p></div></details>
<details class="doc"><summary>Rúbrica breve para valorar el aprendizaje</summary><div class="in scroll"><table class="t"><tr><th>Criterio</th>${NIV.map(n=>`<th>${n}</th>`).join('')}</tr>${RUB.map(r=>`<tr>${r.map((c,i)=>`<td>${i?c:'<b>'+c+'</b>'}</td>`).join('')}</tr>`).join('')}</table><p><i>La rúbrica valora el pensamiento y la comunicación. No califica la calidad artística del dibujo ni la cantidad de colores utilizados.</i></p></div></details>
<details class="doc"><summary>Orientación para la planeación docente</summary><div class="in"><p>Conviene enseñar los organizadores de manera gradual, en situaciones auténticas de lectura, investigación, resolución de problemas y comunicación. No es necesario presentar los 26 en una sola unidad. Selecciona los que respondan a las demandas reales de los textos y proyectos que trabaja el grupo. Antes de pedir un organizador, asegúrate de que el alumnado comprenda la información que va a organizar y que conozca el propósito de cada formato.</p></div></details>
<details class="doc"><summary>Referencias y fuentes de consulta</summary><div class="in"><p>Australian Curriculum, Assessment and Reporting Authority. (s. f.). <i>Graphic organisers.</i> <a href="https://www.australiancurriculum.edu.au/resources/formative-assessment/designing-formative-assessment/graphic-organisers/">australiancurriculum.edu.au</a></p><p>British Council. (s. f.). <i>Graphic organisers.</i> TeachingEnglish. <a href="https://www.teachingenglish.org.uk/professional-development/teachers/knowing-subject/graphic-organisers">teachingenglish.org.uk</a></p><p>Institute on Community Integration. (s. f.). <i>TIP #10: The use of graphic organizers in inclusive classrooms…</i> University of Minnesota. <a href="https://publications.ici.umn.edu/ties/foundations-of-inclusion-tips/graphic-organizers-in-inclusive-classrooms-for-students-with-significant-cognitive-disabilities">publications.ici.umn.edu</a></p><p>Novak, J. D., &amp; Cañas, A. J. (2008). <i>The theory underlying concept maps and how to construct and use them.</i> IHMC. <a href="https://cmap.ihmc.us/Publications/ResearchPapers/TheoryUnderlyingConceptMapsHQ.pdf">cmap.ihmc.us</a></p><p>Los ejemplos infantiles son elaboraciones didácticas originales para contextos de educación primaria.</p></div></details></section>`}

        var b0 = bin.read();

        var b2 = read();

      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);

 if(z==='newlec')return lecEditDlg(null,nw=>{if(S.org&&(nw.orgs||[]).includes(S.org.n))setMom(S.mom,S.et);else if(!S.org)route()});
 if(z==='editlec')return lecEditDlg(v,()=>{if(!S.org)route();else setMom(S.mom,S.et)});
 if(z==='dellec')return dialog('¿Quitar esta lectura?','<p>Los trabajos que ya la usaron la conservan en su registro.</p>',()=>{saveLECS(LECS().filter(l=>l.id!==v));setTimeout(route,30)});
 if(z==='verlec')return lecVerDlg(v,!!S.org);
 if(z==='uselec')return usarLectura(v);
 if(z==='plec')return printLectura(v);
 if(z==='s60print'||z==='s60ver'){const id=$('#s60l').value;if(!id)return toast('Elija una lectura de la lista o agregue una.');return z==='s60print'?printLectura(id):lecVerDlg(id,false)}
 if(z==='prep'){const n=+v;const a=$('#s30a'),b=$('#s60a');if(a)a.value=n;if(b){b.value=n;b.dispatchEvent(new Event('change'))}a&&a.closest('section').scrollIntoView({behavior:'smooth'});return}
 if(z==='ini30'){const n=+$('#s30a').value,n2=+$('#s30b').value;return sesStart({tipo:30,n,n2:n2&&n2!==n?n2:0})}
 if(z==='ini60'){const n=+$('#s60a').value,l=$('#s60l').value||null;return sesStart({tipo:60,n,lec:l})}
 if(z==='snext')return sesGo(SES.paso+1);if(z==='sprev')return sesGo(SES.paso-1);if(z==='sgo'){$('#modal').classList.remove('show');return sesGo(+v)}
 if(z==='slist')return sesListDlg();
 if(z==='spausa'){if(SES.pausa){SES.acum+=Date.now()-SES.pausa;SES.pausa=0}else SES.pausa=Date.now();sesSave();return sesBar()}
 if(z==='sotro'){const n=S.org&&S.org.n===SES.n2?SES.n:SES.n2;location.hash='#org-'+pad(n);return}
 if(z==='sfin')return dialog('¿Terminar la sesión?',`<p>Se registrará hasta el paso ${SES.max} de ${sesPasos().length}.</p>`,()=>{setTimeout(sesEnd,30)});
 if(z==='pword'){const mm=$('#modal');leeOp(mm);return exportWord(PITEMS,POPT)}
 if(z==='cgrp'){const[gr,gp]=v.split('|');CUAD.gr=+gr;CUAD.gp=gp;CUAD.rem=null;return cuadView()}
 if(z==='csel'){document.querySelectorAll('.cdx').forEach(c=>c.checked=v==='1');return}
 if(z==='cprint'||z==='cword'){const ids=[...document.querySelectorAll('.cdx:checked')].map(c=>c.value),its=ids.map(cuadItem).filter(Boolean).reverse();if(!its.length)return toast('Marque al menos una actividad.');if(z==='cword')return exportWord(its,Object.assign({},POPT,{org:SCH?'blanco':POPT.org}));return printDlg(its,{org:SCH?'blanco':POPT.org})}
 if(z==='cp1'){const it=cuadItem(v);if(it)printDlg([it],{org:SCH?'blanco':POPT.org});return}
 if(z==='cver')return cuadVer(v);
 if(z==='evg'){EVF.gr=+v;EVF.gp='';return evalView()}
 if(z==='evlimpia'){EVF={gr:EVF.gr,gp:'',n:0,de:'',a:'',q:''};return evalView()}
 if(z==='evabrir'){const e2=bitAll()[v];if(!e2)return;if(SCH&&e2.gr)setCtx(e2.gr,e2.gp);location.hash='#org-'+pad(e2.n);return}
 if(z==='evp1'){const e2=bitAll()[v];if(e2)printDlg([e2]);return}
 if(z==='evcsv')return evalCSV();
 if(z==='bkp')return respaldo();if(z==='bkpo')return $('#bkpf').click();
 if(z==='ghsave')return ghSave();if(z==='ghnow'){markDirty('todo');return syncNow(true)}
 if(z==='ghdel')return dialog('¿Quitar la llave?','<p>Esta computadora dejará de subir los cambios a GitHub. Lo ya publicado no se borra.</p>',()=>{const c=ghCfg();delete c.token;lsSet('oya:gh',JSON.stringify(c));setTimeout(route,30)});
 if(z==='proy'){e.preventDefault();return proyToggle()}
 if(z==='sorteo')return sorteoDlg();if(z==='sorgo')return sortear();if(z==='sorrst'){const st=sorLee();st.usados=[];lsSet(sorK(),JSON.stringify(st));$('#sorn').textContent='?';$('#sorus').textContent='Nadie ha participado hoy.';return}
 if(z==='decir')return decirPane();
 if(z==='sdecir'&&SES){const p=sesPasos()[SES.paso];return say(p[2]+'. '+p[3])}
 if(z==='plan30')return planeacion(30);if(z==='plan60')return planeacion(60);
 if(z==='bank60'){if(!$('#s60a')){PEND60=v;location.hash='#clases';return}return usar60(v)}
 if(z==='go30'){if(SCH&&!CTX)return toast('Primero elija el grupo.');return sesStart({tipo:30,n:+v,n2:0})}
 if(z==='go60'){if(SCH&&!CTX)return toast('Primero elija el grupo.');const l=lecsPara(+v)[0];return sesStart({tipo:60,n:+v,lec:l?l.id:null})}
 if(z==='hor')return horarioDlg();
 if(z==='jgr')return juegoResp(v,t);if(z==='jgsig')return juegoSig();if(z==='jgotra'){juegoNuevo();return juegoView()}
 if(z==='qr'){const[gr,gp]=v.split('|');return qrDlg(gr,gp)}if(z==='qrp'){const[gr,gp]=v.split('|');return qrHoja([[gr,gp]])}
 if(z==='qrtodos'){const G=grupos(),L=[];for(let g=1;g<=6;g++)G[g].forEach(gp=>L.push([g,gp]));return qrHoja(L)}
 if(z==='resprint'){const r=$('#resmes');if(r)imprimirHTML([`<div class="resumen-mes-imp"><h1>Resumen mensual</h1>${r.querySelector('.rm8w').innerHTML}</div>`]);return}
 if(z==='instalar'&&INSTP){INSTP.prompt();INSTP.userChoice.finally(()=>{INSTP=null;const b=$('#instb');if(b)b.remove()});return}
 if(z==='lecx')return lecDockX();
 if(z==='lecmin'){const k=$('#lecd');if(!k)return;k.classList.toggle('min');t.textContent=k.classList.contains('min')?'▴ Abrir':'▾ Minimizar';lecTop();return}
 if(z==='bdgrande')return bdGrande();if(z==='vgm')return bdGrande.z&&bdGrande.z(1/1.25);if(z==='vgp')return bdGrande.z&&bdGrande.z(1.25);
 if(z==='pzver')return pzVer();
 if(z==='bhmas'){const h=$('.bh');if(h)h.classList.toggle('mas-opciones');return}
 if(z==='sbmas'){const b=$('#sesbar');if(b)b.classList.toggle('abierto');return}
}
document.addEventListener('click',accion);
document.addEventListener('keydown',e=>{teclasTablero(e);teclasPaso(e)});
document.addEventListener('toggle',e=>{const d=e.target;if(d.classList&&d.classList.contains('mas-opciones')){const t=d.closest('.tools');if(t)t.classList.toggle('mas-opciones-abierto',d.open)}},true);

prefs();route();vzBar();
}
